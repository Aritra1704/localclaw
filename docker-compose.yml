services:
  postgres:
    image: postgres:16-alpine
    container_name: localclaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: localclaw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    volumes:
      - ./.localclaw/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d localclaw
      interval: 5s
      timeout: 5s
      retries: 20
